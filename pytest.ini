[pytest]
# Prevent interop tests from hanging indefinitely.
# When a test exceeds this duration, pytest-timeout fails it and prints stack traces.
# Full-suite runs can add enough system load that some interop cases become flaky at 30s.
timeout = 60
timeout_method = thread
