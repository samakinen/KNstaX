#
# Host build and test suite (also under the host-small and host-minimal
# profiles), the same suite under ASan/UBSan, the media gates (including the
# configuration the Habinari knxip image ships), the bare-metal size gate (one
# reference device per profile and core), and the KNXnet/IP interop harness.
# Everything here runs on a stock Ubuntu runner: no
# ESP-IDF and no hardware. The ESP-IDF build of the stack is exercised by the
# firmware job of the Habinari project, which builds every image that ships.

name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host build and CTest (secure ${{ matrix.secure }}, tunnelling ${{ matrix.tunneling }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        secure: ["ON", "OFF"]
        tunneling: ["ON"]
        # Without the KNXnet/IP client role, as the knxip image ships it, so
        # the tests that remain keep building and passing in that shape.
        include:
          - secure: "ON"
            tunneling: "OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libmbedtls-dev zlib1g-dev python3-xmlschema

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DKNX_SECURE_ENABLED=${{ matrix.secure }} -DBUILD_TESTS=ON
          -DKNX_FEATURE_TUNNELING=${{ matrix.tunneling }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

  # The suite under the smaller host profiles, so that a feature or capacity
  # gate cannot rot unseen. Tests that need a feature a profile leaves out are
  # not registered; those that need full capacities carry the label
  # needs-full-capacity and are excluded where the profile shrinks them.
  host-profiles:
    name: Host build and CTest (profile ${{ matrix.profile }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: host-small
            ctest_args: -LE needs-full-capacity
          - profile: host-minimal
            ctest_args: -LE needs-full-capacity
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libmbedtls-dev zlib1g-dev python3-xmlschema

      - name: Configure
        run: >
          cmake -S . -B build_${{ matrix.profile }} -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON -DKNX_HOST_PROFILE=${{ matrix.profile }}

      - name: Build
        run: cmake --build build_${{ matrix.profile }} -j"$(nproc)"

      - name: Test
        run: >
          ctest --test-dir build_${{ matrix.profile }} --output-on-failure -j"$(nproc)"
          ${{ matrix.ctest_args }}

  # Bare-metal size gate, one reference device per profile and core, and the
  # tp1-small device with Data Secure (variant secure: software AES, no crypto
  # library); docs/design/small-target-profile.md section 7. Each run links the
  # device with LTO, checks flash and static RAM against the ratcheting budget of
  # test/baremetal/size_gate/budgets/<profile>[-<variant>]-<core>.json and runs the forbid
  # list; the Cortex-M3 device is also run under QEMU for the heap high-water
  # mark. On a pull request the base is measured first, with the same gate, and
  # the change of every figure is printed and put in the job summary.
  size-gate:
    name: Size gate (${{ matrix.profile }}${{ matrix.variant && format(' {0}', matrix.variant) || '' }}, ${{ matrix.cpu }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: tp1-small-m3
            profile: tp1-small
            cpu: cortex-m3
          - id: tp1-standard-m4
            profile: tp1-standard
            cpu: cortex-m4
          - id: tp1-small-m0plus
            profile: tp1-small
            cpu: cortex-m0plus
          - id: tp1-small-secure-m3
            profile: tp1-small
            variant: secure
            cpu: cortex-m3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            qemu-system-arm cmake ninja-build python3

      # The base's figures come from the base's KNstaX tree measured with this
      # revision's reference device, so the numbers are comparable. A base that
      # does not build with it (an API change the device follows) gives no
      # baseline and the step says so; it never fails the job, and the budget
      # is not applied to it.
      - name: Measure the base (pull requests)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git worktree add ../knstax_base "${{ github.event.pull_request.base.sha }}"
          KNX_SIZE_GATE_KNSTAX_ROOT="$PWD/../knstax_base" \
            sh test/baremetal/size_gate/run_gate.sh "$PWD/build_size_gate_base/${{ matrix.id }}" \
              ${{ matrix.profile }} ${{ matrix.cpu }} "${{ matrix.variant }}" || echo "base: gate exit status $? (the base's own budget does not matter here)"
          test -f "build_size_gate_base/${{ matrix.id }}/gate_report.json"

      - name: Size gate
        run: |
          baseline="$PWD/build_size_gate_base/${{ matrix.id }}/gate_report.json"
          if [ -f "$baseline" ]; then export KNX_SIZE_GATE_BASELINE="$baseline"; fi
          sh test/baremetal/size_gate/run_gate.sh "$PWD/build_size_gate/${{ matrix.id }}" \
            ${{ matrix.profile }} ${{ matrix.cpu }} "${{ matrix.variant }}"

      - name: Job summary
        if: always()
        run: |
          report="build_size_gate/${{ matrix.id }}/gate_report.txt"
          if [ -f "$report" ]; then
            {
              echo "### Size gate: ${{ matrix.profile }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }} on ${{ matrix.cpu }}"
              echo '```'
              sed -n '/^Reference device/,$p' "$report"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the gate report and map file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: size-gate-${{ matrix.id }}
          if-no-files-found: warn
          path: |
            build_size_gate/${{ matrix.id }}/gate_report.txt
            build_size_gate/${{ matrix.id }}/gate_report.json
            build_size_gate/${{ matrix.id }}/gate/size_gate.elf.map
            build_size_gate/${{ matrix.id }}/gate/knx-config/knx.config
            build_size_gate_base/${{ matrix.id }}/gate_report.json

  # The GD32F1 reference port (ports/gd32f1): its example firmware links with
  # the port's start-up, linker script and HALs, warnings as errors. Not run:
  # QEMU has no GD32F103. The image is kept as an artefact.
  reference-port:
    name: Reference port (gd32f1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cmake ninja-build python3

      - name: Build the example
        run: |
          cmake -S ports/gd32f1 -B build_port -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/toolchains/arm-none-eabi.cmake" \
            -DKNX_GD32F1_WERROR=ON
          cmake --build build_port

      - uses: actions/upload-artifact@v4
        with:
          name: gd32f1-example
          path: |
            build_port/knx_gd32f1_example.elf
            build_port/knx_gd32f1_example.bin
            build_port/knx_gd32f1_example.elf.map

  sanitizers:
    name: CTest under ASan and UBSan
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libmbedtls-dev zlib1g-dev python3-xmlschema

      - name: Configure
        run: >
          cmake -S . -B build_san -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
          -DKNX_WARNINGS_AS_ERRORS=ON
          "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"

      - name: Build
        run: cmake --build build_san -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build_san --output-on-failure -j"$(nproc)"

  # Proves the media gates are real: each shape must build, warnings as
  # errors, with nothing from a gated-out medium in it. knxip is the
  # configuration the Habinari KNXnet/IP image ships: no TP1, routing with
  # Secure Routing, no tunnelling client.
  media-gating:
    name: Library only (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tp1-only
            flags: -DKNX_FEATURE_NETIP=OFF -DKNX_FEATURE_TP1=ON -DKNX_SECURE_ENABLED=ON
          - name: netip-only
            flags: -DKNX_FEATURE_NETIP=ON -DKNX_FEATURE_TP1=OFF -DKNX_SECURE_ENABLED=ON
          - name: knxip
            flags: >-
              -DKNX_FEATURE_TP1=OFF -DKNX_FEATURE_NETIP=ON -DKNX_SECURE_ENABLED=ON
              -DKNX_FEATURE_TUNNELING=OFF -DKNX_FEATURE_VIRTUAL_BUS=OFF
              -DKNX_FEATURE_ETS_TOOLING=OFF -DKNX_ENABLE_TEST_HOOKS=OFF
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libmbedtls-dev

      - name: Configure and build
        run: |
          cmake -S . -B build_${{ matrix.name }} -G Ninja -DBUILD_TESTS=OFF \
            -DKNX_WARNINGS_AS_ERRORS=ON ${{ matrix.flags }}
          cmake --build build_${{ matrix.name }} -j"$(nproc)"

  interop:
    name: KNXnet/IP interop (xknx)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libmbedtls-dev zlib1g-dev python3-venv

      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r interop/python/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: >
          cmake -S . -B build_interop -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTS=ON -DENABLE_INTEROP_TESTS=ON
          -DPython3_EXECUTABLE="$PWD/.venv/bin/python"

      - name: Build
        run: cmake --build build_interop -j"$(nproc)" --target interop_peers

      - name: Interop suite
        run: ctest --test-dir build_interop -R interop_pytest --output-on-failure
