name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs: {}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      tp1: ${{ steps.filter.outputs.tp1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tp1:
              - 'include/knx/physical/**'
              - 'src/physical/**'
              - 'test/unit/test_tp1_*'
              - 'test/unit/test_bitbang_*'
              - 'test/scripts/test_tp1_*'
              - 'scripts/ci/tp1_*'
              - 'scripts/hil/tp1_*'
              - 'docs/TP1_BITBANG_EXTERNAL_REFERENCE_INTEGRATION_PLAN.md'
              - 'CMakeLists.txt'

  tp1-priority:
    needs: detect-changes
    if: needs.detect-changes.outputs.tp1 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v3
        with:
          cmake-version: "3.26.4"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config cmake cpack

      - name: Configure
        run: cmake -S . -B build_tp1_priority -DKNX_PLATFORM=linux -DKNX_SECURE_ENABLED=ON -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build_tp1_priority -j

      - name: Run TP1 quick regression gate
        run: ./scripts/ci/tp1_ctest_regression.sh --build-dir build_tp1_priority

      - name: Run TP1 virtual simulator suite
        run: ./scripts/ci/ctest_with_backtraces.sh --test-dir build_tp1_priority -L tp1-virtual --output-on-failure

      - name: Run TP1 diagnostics adapter mapping check
        run: ./scripts/ci/tp1_ack_diagnostics_adapter_mapping_check.sh

  # The configuration that actually ships. Before this job existed, the ESP-IDF
  # component was only ever built by hand — which is how a decorative Kconfig
  # media switch, a -Wpedantic flag that made ESP-IDF's own headers fatal, and a
  # GPIO HAL that only compiled for one SoC family all survived unnoticed.
  esp-idf:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two SoC families on purpose: xtensa (esp32) and RISC-V (esp32c6)
        # declare the GPIO registers the bitbang backend writes differently.
        target: [ esp32, esp32c6 ]
        example: [ esp_idf_switch, esp_idf_temperature_sensor, esp_idf_low_power_sensor ]
    container:
      image: espressif/idf:release-v5.3
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.example }} for ${{ matrix.target }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd examples/${{ matrix.example }}
          idf.py set-target ${{ matrix.target }}
          idf.py build

      - name: Enforce the KNstaX flash budget
        if: matrix.example == 'esp_idf_switch'
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python3 scripts/ci/knstax_size_budget.py \
            --map examples/esp_idf_switch/build/knstax_esp_idf_switch.map \
            --budget 300000 \
            --forbid tunneling_session_client \
            --forbid ip_routing_physical \
            --forbid ip_tunneling_physical \
            --forbid routing_endpoint

  # Proves the media gates are real. A TP1-only build must not merely link less
  # KNXnet/IP code — it must not compile any, headers included.
  media-gating:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: tp1-only
            flags: "-DKNX_FEATURE_NETIP=OFF -DKNX_FEATURE_TP1=ON"
          - name: netip-only
            flags: "-DKNX_FEATURE_NETIP=ON -DKNX_FEATURE_TP1=OFF"
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v3
        with:
          cmake-version: "3.26.4"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config

      - name: Configure and build (${{ matrix.name }})
        run: |
          cmake -S . -B build_${{ matrix.name }} -DKNX_PLATFORM=linux \
            -DBUILD_TESTS=OFF -DKNX_BUILD_EXAMPLES=OFF ${{ matrix.flags }}
          cmake --build build_${{ matrix.name }} --target knx_core -j

  # The quality gates the README documents. They were never run.
  sdk-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v3
        with:
          cmake-version: "3.26.4"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config
          python3 -m pip install --user xmlschema

      - name: Configure
        run: cmake -S . -B build_sdk -DKNX_PLATFORM=linux -DBUILD_TESTS=ON -DKNX_BUILD_EXAMPLES=ON

      - name: Public header contracts
        run: cmake --build build_sdk --target knx_sdk_public_header_contracts -j2

      - name: Example contracts
        run: cmake --build build_sdk --target knx_sdk_example_contracts -j2

      - name: Release gate
        run: cmake --build build_sdk --target knx_sdk_release_gate -j2

  build:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        secure: [ "ON", "OFF" ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v3
        with:
          cmake-version: "3.26.4"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build pkg-config cmake cpack

      - name: Configure
        run: |
          cmake -S . -B build -DKNX_PLATFORM=linux -DKNX_SECURE_ENABLED=${{ matrix.secure }} -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j

      - name: Run TP1 quick regression gate
        run: ./scripts/ci/tp1_ctest_regression.sh --build-dir build

      - name: Run TP1 virtual simulator suite
        run: ./scripts/ci/ctest_with_backtraces.sh --test-dir build -L tp1-virtual --output-on-failure

      - name: Run tests
        run: ./scripts/ci/ctest_with_backtraces.sh --test-dir build --output-on-failure

      - name: Run TP1 diagnostics adapter mapping check
        run: ./scripts/ci/tp1_ack_diagnostics_adapter_mapping_check.sh

      - name: Install to staging
        run: cmake --install build --prefix ${{ runner.temp }}/knstax-install

      - name: Create packages with CPack
        run: |
          pushd build
          cpack -G TGZ || true
          cpack -G ZIP || true
          popd

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: knstax-packages-${{ matrix.secure }}
          path: |
            build/*.tar.gz
            build/*.zip

