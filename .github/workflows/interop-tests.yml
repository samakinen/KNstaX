name: Interop Tests

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'interop/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'build.sh'

jobs:
  interop:
    name: Build + Interop Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-venv python3-pip libmbedtls-dev libmbedcrypto-dev

      - name: Configure CMake (interop enabled)
        run: cmake -S . -B build -DENABLE_INTEROP_TESTS=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -- -j$(nproc)

      - name: Run interop tests (venv)
        run: |
          python3 -m venv interop/.venv
          source interop/.venv/bin/activate
          pip install --upgrade pip
          if [ -f interop/python/requirements.txt ]; then pip install -r interop/python/requirements.txt; fi
          # Set peer binary envs to the built artifacts and run the harness script
          export KNSTAX_TUNNEL_PEER_BIN=build/interop/bin/knstax_tunnel_peer
          export KNSTAX_ROUTING_PEER_BIN=build/interop/bin/knstax_routing_peer
          bash interop/run_venv_tests.sh build
        env:
          CI: true

      - name: Upload interop logs
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: interop/*.log
