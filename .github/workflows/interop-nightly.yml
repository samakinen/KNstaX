name: Interop tests (nightly)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # nightly at 03:00 UTC

jobs:
  interop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-venv python3-pip libmbedtls-dev

      - name: Configure CMake
        run: |
          cmake -S . -B build_ci -DKNX_PLATFORM=linux -DBUILD_TESTS=ON -DENABLE_INTEROP_TESTS=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build_ci -j

      - name: Setup Python venv and install test deps
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r interop/python/requirements.txt || true

      - name: Run interop pytest via CTest
        run: |
          ctest --test-dir build_ci -R interop_pytest -V
        env:
          # CTest will set these for the pytest run, but ensure PATHs are visible
          KNSTAX_TUNNEL_PEER_BIN: ${{ github.workspace }}/build_ci/interop/bin/knstax_tunnel_peer
          KNSTAX_ROUTING_PEER_BIN: ${{ github.workspace }}/build_ci/interop/bin/knstax_routing_peer
